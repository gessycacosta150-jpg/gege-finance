<script>
window.GEGE_V = 5; window.GEGE_NATIVO = 3; window.GEGE_NOME = '1.4';
(function () {
  try {
    if (window.__gegeAtual) return;
    localStorage.setItem('gege-nativo', String(window.GEGE_NATIVO));
    var v = +localStorage.getItem('gege-app-v') || 0, h = localStorage.getItem('gege-app-html'), t = +localStorage.getItem('gege-tentativas') || 0;
    if (v > window.GEGE_V && h) {
      if (t >= 3) { localStorage.removeItem('gege-app-html'); localStorage.removeItem('gege-app-v'); localStorage.setItem('gege-tentativas', '0'); return; }
      localStorage.setItem('gege-tentativas', String(t + 1));
      window.__gegeTrocar = h;
      document.addEventListener('DOMContentLoaded', function () { var x = window.__gegeTrocar; window.__gegeTrocar = null; window.__gegeAtual = true; document.open(); document.write(x); document.close(); });
      document.write('<plaintext style="display:none">');
    } else if (v) { localStorage.removeItem('gege-app-html'); localStorage.removeItem('gege-app-v'); }
  } catch (e) {}
})();
</script>

<script>

/* ---------- data ---------- */

const pagasAntes = (r, m) => lanc.filter((q) => q.rid === r.id && q.pago && !q.skip && q.mes >= r.inicio && q.mes < m).length;

const stepHtml = () => `<div class="step"><button data-act="mes" data-k="-1" aria-label="Mês anterior">‹</button><div>${MESES[+st.mes.slice(5)-1]}<small>${st.mes.slice(0,4)}</small></div><button data-act="mes" data-k="1" aria-label="Próximo mês">›</button></div>`;

  const all = doMes(st.mes).filter((x) => (tipo === 'entrada') === (x.tipo === 'entrada')).sort(ordem);

/* ---------- análise automática: refeita a cada mudança, olhando todos os lançamentos ---------- */
let plano = {};
const ESSENCIAIS = ['Dívidas antigas (FIES e CAU)', 'Terrenos e IPTU', 'Casa, estudo e transporte'];
const VARIAVEIS = ['Alimentação e mercado', 'Pets e cuidados pessoais', 'Lazer e compras'];
const doCartao = (x) => x.tipo !== 'entrada' && (/^cart[aã]o/i.test(x.forma || '') || /^fatura/i.test(x.grupo || ''));

function analise(m) {

  const ativos = rec.filter((r) => r.tipo !== 'entrada' && ativa(r, m));

  const altas = VARIAVEIS.map((c) => { const atual = sum(sai.filter((x) => x.cat === c)), med = media((x) => x.tipo !== 'entrada' && x.cat === c); return { c, atual, med, d: atual - med }; }).filter((x) => x.med && x.d > Math.max(30, x.med * 0.1)).sort((a, b) => b.d - a.d);

  const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), fimS = new Date(seg); fimS.setDate(seg.getDate() + 7); const segA = new Date(seg); segA.setDate(seg.getDate() - 7);
  const semana = (a, b) => sum(lanc.filter((x) => x.tipo !== 'entrada' && VARIAVEIS.includes(x.cat) && (x.venc || '') >= a && (x.venc || '') < b));
  const varM = (mm) => sum(doMes(mm).filter((x) => x.tipo !== 'entrada' && (VARIAVEIS.includes(x.cat) || doCartao(x))));
  const metaEco = sobra < 0 ? -sobra : arred(varM(m) * 0.1, 10);
  return { E, S, sobra, cartao, mCart, teto, reserva, guardar, essPend, opcionais, terminando, liberado, dividas, extra, transp, assin, taxas, altas,
    semana: semana(iso(seg), iso(fimS)), semanaAnt: semana(iso(segA), iso(seg)), sexta: dt.getDay() === 5, varAtual: varM(m), varAnt: varM(addM(m, -1)), metaEco,

const nomesL = (a, n = 3) => a.slice(0, n).map((x) => x.desc).join(', ') + (a.length > n ? ' e mais ' + (a.length - n) : '');
function ordemDoMes(A) {

</div>`;

  if (A.terminando.length) it.push(['Parcelas acabando', 'ok', A.terminando.map((p) => `${p.r.desc} (falta${p.falta > 1 ? 'm ' + p.falta : ' 1'})`).join(', ') + ` · libera ${brl(A.liberado)}/mês: mande direto para reserva ou dívida`]);
  if (A.altas.length) { const a = A.altas[0]; it.push(['Gasto que subiu', 'warn', `${a.c}: ${brl(a.atual)} contra média de ${brl(a.med)} (+${brl(a.d)}). Voltar à média já economiza esse valor`]); }
  if (A.transp.length >= 4) it.push(['Vazamento: transporte por app', 'warn', `${A.transp.length} corridas somando ${brl(sum(A.transp))} em ${nomeM(m)}. Cortar metade economiza cerca de ${brl(sum(A.transp) / 2)}`]);

  return doMes(st.mes).filter((x) => (tipo === 'entrada') === (x.tipo === 'entrada')).sort(ordem).filter((x) => (st.filtro === 'todas' || estado(x)[2] === st.filtro) && (!q || (x.desc + ' ' + (x.cat || '') + ' ' + (x.forma || '') + ' ' + (x.grupo || '')).toLowerCase().includes(q)));
}
function selbarHtml(tipo) {
  if (!st.selMode) return '';
  const n = st.sel.size, tot = visiveis(tipo).length;
  return `<div class="selbar" role="region" aria-label="Seleção"><b>${n} selecionad${n === 1 ? 'a' : 'as'}</b><button data-act="sel-todas">${n && n === tot ? 'Desmarcar todas' : 'Selecionar todas (' + tot + ')'}</button><button data-act="sel-pagar" ${n ? '' : 'disabled'}>✔ Marcar ${tipo === 'entrada' ? 'recebidas' : 'pagas'}</button><button class="del" data-act="sel-excluir" ${n ? '' : 'disabled'}>🗑 Excluir</button><button data-act="sel-sair">Cancelar</button></div>`;
}
let desfazerUlt = null, undoT = null;
function mostrarUndo(texto) {
  let el = document.getElementById('undo');
  if (!el) { el = document.createElement('div'); el.id = 'undo'; el.className = 'undo'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = `<span>${esc(texto)}</span><button data-act="desfazer">↩ Desfazer</button>`; el.hidden = false;
  clearTimeout(undoT); undoT = setTimeout(() => { el.hidden = true; }, 10000);
}
async function apagarVarios(keys, rotulo) {
  const antes = [];
  for (const k of keys) {
    const x = achar(k); if (!x) continue;
    if (x.id) { const raw = lanc.find((q) => q.id === x.id); const { id, ...dados } = raw || {}; antes.push({ id: x.id, dados });
      if (x.rid) await C.lanc.doc(x.id).set({ ...dados, skip: true }); else await C.lanc.doc(x.id).delete(); }
    else if (x.rid) { const id = instId(x); antes.push({ id, dados: null }); await C.lanc.doc(id).set({ ...corpo(x), skip: true }); }
  }
  if (!antes.length) return;
  desfazerUlt = antes; st.sel.clear();
  mostrarUndo('🗑 ' + (rotulo || (antes.length === 1 ? '1 item excluído' : antes.length + ' itens excluídos')) + '.');
}
async function desfazer() {
  const lista = desfazerUlt; if (!lista) return; desfazerUlt = null;
  try { for (const { col, id, dados } of lista) { const cc = col === 'rec' ? C.rec : C.lanc; if (dados) await cc.doc(id).set(dados); else await cc.doc(id).delete(); }
    const el = document.getElementById('undo'); if (el) el.hidden = true; toast('↩ Pronto, voltou tudo pro lugar!'); }
  catch (e) { toast('⚠️ Não consegui desfazer agora.'); }
}
async function pagarVarios(keys) {
  for (const k of keys) { const x = achar(k); if (!x || x.pago) continue; if (x.id) await C.lanc.doc(x.id).update({ pago: true }); else await C.lanc.doc(instId(x)).set(corpo({ ...x, pago: true })); }
  st.sel.clear(); st.selMode = false; toast('✅ Marcadas! Menos coisa pra pensar.'); render();
}
const normNome = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z ]/g, ' ').split(/\s+/).filter((w) => w.length >= 3 && !['pagto', 'pagamento', 'pag', 'compra', 'pix', 'cartao', 'credito', 'debito', 'boleto', 'enviado', 'recebido', 'parcela', 'conta', 'para'].includes(w));
function parecidos(a, b) {
  const A = normNome(a), B = normNome(b); if (!A.length || !B.length) return false;
  const sa = A.join(' '), sb = B.join(' '); if (sa === sb || sa.includes(sb) || sb.includes(sa)) return true;
  const inter = A.filter((w) => B.includes(w)).length; return inter / Math.min(A.length, B.length) >= 0.5;
}
const assinDup = (a, b) => [a.mes, a.desc, b.desc, (+a.valor).toFixed(2)].sort().join('|');
function duplicadas(tipo) {
  const ign = (cfg.naoDup || []), it = doMes(st.mes).filter((x) => (tipo === 'entrada') === (x.tipo === 'entrada') && +x.valor > 0), out = [];
  for (let i = 0; i < it.length; i++) for (let j = i + 1; j < it.length; j++) {
    const a = it[i], b = it[j];
    if (Math.abs(+a.valor - +b.valor) < 0.005 && parecidos(a.desc, b.desc) && !ign.includes(assinDup(a, b)) && !(a.rid && a.rid === b.rid)) out.push([a, b]);
  }
  return out.slice(0, 12);
}
function dupHtml(tipo) {
  const d = duplicadas(tipo); if (!d.length) return '';
  const lin = (x) => `${esc(x.desc)}${x.grupo ? ' <span class="muted">(' + esc(x.grupo) + ')</span>' : ''}${x.pago ? ' ✔' : ''}`;
  return `<div class="card"><div><h2>🔍 Possíveis duplicadas (${d.length})</h2><p class="sub">Mesmo valor e nomes parecidos neste mês. Confira antes de apagar.</p></div>
    ${d.map(([a, b]) => `<div class="dup"><div><b>${brl(a.valor)}</b> · ${lin(a)} <span class="muted">e</span> ${lin(b)}</div><div class="acts"><button class="btn danger" data-act="dup-del" data-k="${esc(key(a))}">Apagar «${esc(a.desc.slice(0, 22))}»</button><button class="btn danger" data-act="dup-del" data-k="${esc(key(b))}">Apagar «${esc(b.desc.slice(0, 22))}»</button><button class="btn ghost" data-act="dup-ok" data-k="${esc(assinDup(a, b))}">Não é duplicada</button></div></div>`).join('')}</div>`;
}
async function naoDuplicada(sig) {
  const lista = [...new Set([...(cfg.naoDup || []), sig])].slice(-300);
  try { await db.doc('config/ajustes').set({ ...cfg, naoDup: lista }); cfg = { ...cfg, naoDup: lista }; render(); toast('👍 Ok, não vou mais perguntar desse par.'); } catch (e) { toast('⚠️ Não consegui salvar agora.'); }
}

/* ---------- events ---------- */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, k = el.dataset.k;
  if (a === 'tab') ir(k);
  else if (a === 'mes') { st.sel.clear(); st.mes = addM(st.mes, +k); render(); }
  else if (a === 'filtro') { st.filtro = k; render(); }
  else if (a === 'dia') { st.dia = k; render(); }
  else if (a === 'new') { if (st.tab === 'objetivos') objForm({ nome: '', guardado: 0 }); else { $ed._c = null; novoForm(); } }
  else if (a === 'seg' && el.dataset.n === 'etipo') trocarTipoEdit(el.dataset.k);
  else if (a === 'seg') { const c = lerNovo(); c[el.dataset.n] = k; novoForm(); }
  else if (a === 'edit') { const x = achar(k); if (x && canWrite) editForm(x); }
  else if (a === 'obj') { const o = obj.find((q) => q.id === k); if (o && canWrite) objForm(o); }
  else if (a === 'guardar') { const o = obj.find((q) => q.id === k); if (o) guardarForm(o); }
  else if (a === 'close') fechar();
  else if (a === 'dobra') { const kk = el.dataset.k, atual = kk === 'plano' ? (st.dobra.plano ?? false) : (st.dobra.estrat ?? true); st.dobra[kk] = !atual; render(); }
  else if (a === 'voltar') { let t = st.pilha.pop(); while (t === st.tab && st.pilha.length) t = st.pilha.pop(); ir(t && t !== st.tab ? t : 'inicio', true); }
  else if (a === 'edit-reset') { const c = $ed._c; if (c && c.kind === 'edit') { editForm(c.x); toast('↺ Campos voltaram como estavam.'); } }
  else if (a === 'close-bg') { if (ev.target === el) fechar(); }
  else if (a === 'save-novo') salvarNovo();
  else if (a === 'save-edit') salvarEdit();
  else if (a === 'save-obj') salvarObj();
  else if (a === 'save-add') { const o = $ed._c.o, v = parseV(val('f-add')); if (!(v > 0)) return erro('Digite o valor, por exemplo 300,00.'); try { await C.obj.doc(o.id).update({ guardado: Math.round(((+o.guardado||0) + v) * 100) / 100 }); fechar(); toast((+o.guardado||0) + v >= o.meta ? '🏆 Meta batida! Você é demais.' : '🐷 Guardado! O porquinho agradece.'); } catch (e) { falha(e); } }
  else if (a === 'del') excluir(el);
  else if (a === 'grp') { st.abertos.has(k) ? st.abertos.delete(k) : st.abertos.add(k); render(); }
  else if (a === 'sel-modo') { st.selMode = !st.selMode; st.sel.clear(); render(); }
  else if (a === 'sel-sair') { st.selMode = false; st.sel.clear(); render(); }
  else if (a === 'sel-todas') { const vs = visiveis(st.tab === 'recebimentos' ? 'entrada' : 'saida').map(key); if (st.sel.size === vs.length) st.sel.clear(); else vs.forEach((x) => st.sel.add(x)); render(); }
  else if (a === 'sel-excluir') { const ks = [...st.sel]; st.selMode = false; apagarVarios(ks).catch(() => toast('⚠️ Não consegui excluir agora.')); }
  else if (a === 'sel-pagar') pagarVarios([...st.sel]).catch(() => toast('⚠️ Não consegui marcar agora.'));
  else if (a === 'desfazer') desfazer();
  else if (a === 'upd-buscar') buscarAtualizacao(true);
  else if (a === 'upd-aplicar') location.reload();
  else if (a === 'upd-fechar') { const u = document.getElementById('upd'); if (u) u.hidden = true; }
  else if (a === 'dup-del') apagarVarios([k], '1 duplicada apagada').catch(() => toast('⚠️ Não consegui apagar agora.'));
  else if (a === 'dup-ok') naoDuplicada(k);
  else if (a === 'imp-open') { $ed._c = null; impForm(); }
  else if (a === 'imp-save') importar();
  else if (a === 'imp-pdf') abrirPDF(val('f-senha'));
  else if (a === 'cfg-tom') { st.tom = k; document.querySelectorAll('[data-act=cfg-tom]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === k))); }
  else if (a === 'cfg-save') salvarCfg();
  else if (a === 'vis') setVis({ [el.dataset.n]: k });
  else if (a === 'vis-trocar') { const f = document.getElementById('vis-foto'); if (f) { f.value = ''; f.click(); } }
  else if (a === 'vis-rm') tirarFoto();
  else if (a === 'av-teste') testarAviso().catch(() => toast('⚠️ Não consegui agendar o aviso.'));
  else if (a === 'bk-exp') exportar();
  else if (a === 'bk-imp') { const f = document.getElementById('bk-file'); if (f) { f.value = ''; f.click(); } }
  else if (a === 'bk-ok') restaurar();
});
document.addEventListener('change', async (ev) => {
  const el = ev.target;
  if (el.id === 'bk-file') { if (el.files && el.files[0]) lerBackup(el.files[0]); return; }
  if (el.id === 'vis-foto') { if (el.files && el.files[0]) carregarFoto(el.files[0]); return; }
  if (el.id === 'f-file') { if (el.files && el.files[0]) lerArquivo(el.files[0]).catch(() => erro('Não foi possível abrir o arquivo.')); return; }
  if (el.dataset.chg === 'imp') { const I = $ed._c; I.origem = val('f-origem'); I.mes = val('f-impmes'); if (I.brutos) { montarImp(I); impForm(); } return; }
  if (el.dataset.act === 'sel') { el.checked ? st.sel.add(el.dataset.k) : st.sel.delete(el.dataset.k); render(); return; }
  if (el.dataset.act === 'plano-ck') { if (canWrite) marcarPlano(+el.dataset.k, el.checked); return; }
  if (el.dataset.act === 'sel-grp') { const its = visiveis(st.tab === 'recebimentos' ? 'entrada' : 'saida').filter((x) => x.grupo === el.dataset.k).map(key); its.forEach((x) => el.checked ? st.sel.add(x) : st.sel.delete(x)); render(); return; }
  if (el.dataset.act !== 'toggle') return;
  const x = achar(el.dataset.k); if (!x) return;
  el.disabled = true;
  try { if (x.id) await C.lanc.doc(x.id).update({ pago: el.checked }); else await C.lanc.doc(instId(x)).set(corpo({ ...x, pago: el.checked }));
    if (el.checked) { const n = doMes(x.mes).filter((q) => q.tipo !== 'entrada' && !q.pago && key(q) !== el.dataset.k).length; toast(x.tipo === 'entrada' ? '💰 Caiu na conta! Agora sim.' : n ? '✅ Menos uma! Faltam ' + n + (n === 1 ? ' conta.' : ' contas.') : '👑 Zerou as contas do mês!'); } }
  catch (e) { el.checked = !el.checked; el.disabled = false; if (e && e.code === 'invalid_argument') { canWrite = false; render(); } }
});
document.addEventListener('input', (ev) => { if (ev.target.id !== 'q') return; st.q = ev.target.value; const l = document.getElementById('lista'); if (l) l.innerHTML = listaHtml(st.tab === 'recebimentos' ? 'entrada' : 'saida'); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$ed.hidden) fechar(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== st.tab && okTab(h)) { st.tab = h; render(); } });

/* ---------- armazenamento local ---------- */
const CHAVE = 'contas-gessyca-v1';
let MEM = { lancamentos: {}, recorrentes: {}, objetivos: {}, config: {} };
try { const r = localStorage.getItem(CHAVE); if (r) MEM = Object.assign(MEM, JSON.parse(r)); } catch (e) {}
const OUV = {};
function gravar() { try { localStorage.setItem(CHAVE, JSON.stringify(MEM)); } catch (e) { toast('⚠️ Não consegui salvar no celular. Faça um backup agora.'); } }
function avisar(c) { const list = OUV[c] || []; setTimeout(() => list.forEach((f) => f()), 0); }
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const snapDoc = (c, id) => ({ id, exists: !!MEM[c][id], data: () => MEM[c][id] ? JSON.parse(JSON.stringify(MEM[c][id])) : undefined });
function refDoc(c, id) {
  return { id, path: c + '/' + id,
    get: async () => snapDoc(c, id),
    set: async (d) => { MEM[c][id] = JSON.parse(JSON.stringify(d)); gravar(); avisar(c); },
    update: async (d) => { if (!MEM[c][id]) throw { code: 'invalid_argument' }; MEM[c][id] = { ...MEM[c][id], ...JSON.parse(JSON.stringify(d)) }; gravar(); avisar(c); },
    delete: async () => { delete MEM[c][id]; gravar(); avisar(c); },
    onSnapshot: (f) => { const g = () => f(snapDoc(c, id)); (OUV[c] = OUV[c] || []).push(g); g(); return () => { OUV[c] = OUV[c].filter((x) => x !== g); }; } };
}
function refCol(c) {
  if (!MEM[c]) MEM[c] = {};
  return { path: c, doc: (id) => refDoc(c, id || novoId()),
    add: async (d) => { const r = refDoc(c, novoId()); await r.set(d); return r; },
    onSnapshot: (f) => { const g = () => f({ docs: Object.keys(MEM[c]).sort().map((id) => snapDoc(c, id)) }); (OUV[c] = OUV[c] || []).push(g); g(); return () => { OUV[c] = OUV[c].filter((x) => x !== g); }; } };
}
const LOCAL = { collection: refCol, doc: (p) => { const [c, id] = p.split('/'); if (!MEM[c]) MEM[c] = {}; return refDoc(c, id); } };
const vazio = () => !Object.keys(MEM.lancamentos).length && !Object.keys(MEM.recorrentes).length;
const nativo = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
async function exportar() {
  const txt0 = JSON.stringify({ app: 'contas-gessyca', versao: 1, salvoEm: new Date().toISOString(), dados: MEM }, null, 1);
  if (nativo()) {
    try { const { Filesystem, Share } = window.Capacitor.Plugins, nome = 'gege-finance-backup-' + hoje() + '.json';
      const r = await Filesystem.writeFile({ path: nome, data: txt0, directory: 'CACHE', encoding: 'utf8' });
      await Share.share({ title: 'Backup do Gege Finance', text: 'Backup do Gege Finance (' + dia(hoje()) + ')', files: [r.uri], dialogTitle: 'Guardar backup em…' });
      toast('⬇️ Escolha onde guardar: Drive, WhatsApp ou e-mail para você mesma.');
    } catch (e) { if (!/cancel/i.test(String(e && (e.message || e)))) toast('⚠️ Não consegui gerar o backup agora.'); }
    return;
  }
  const txt = JSON.stringify({ app: 'contas-gessyca', versao: 1, salvoEm: new Date().toISOString(), dados: MEM }, null, 1);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = 'gege-finance-backup-' + hoje() + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('⬇️ Backup salvo em Downloads. Guarde num lugar seguro!');
}
async function lerBackup(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('⚠️ Esse arquivo não é um backup válido.'); return; }
  const d = j && j.dados; if (!d || typeof d.lancamentos !== 'object') { toast('⚠️ Esse arquivo não é um backup do Gege Finance.'); return; }
  const n = Object.keys(d.lancamentos || {}).length, r = Object.keys(d.recorrentes || {}).length;
  sheet(`<h2>Restaurar backup</h2><p style="margin:0">O arquivo tem <b>${n}</b> lançamentos e <b>${r}</b> contas que se repetem${j.salvoEm ? ', salvo em ' + esc(dia(j.salvoEm.slice(0, 10))) + '/' + j.salvoEm.slice(0, 4) : ''}.</p>
    ${vazio() ? '' : '<p class="neg" style="margin:0">Isso substitui tudo o que está no app agora.</p>'}
    <div class="acts"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="bk-ok">Restaurar</button></div>`, { kind: 'bk', d });
}
function restaurar() {
  const d = $ed._c.d; MEM = { lancamentos: {}, recorrentes: {}, objetivos: {}, config: {}, ...JSON.parse(JSON.stringify(d)) }; gravar();
  ['lancamentos', 'recorrentes', 'objetivos', 'config'].forEach(avisar); fechar(); toast('🎉 Backup restaurado! Tudo de volta no lugar.'); ir('inicio');
}

(async () => {
  const h = location.hash.slice(1); if (okTab(h)) st.tab = h;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  db = LOCAL;
  C = { lanc: db.collection('lancamentos'), rec: db.collection('recorrentes'), obj: db.collection('objetivos') };
  db.doc('config/ajustes').onSnapshot((d) => { cfg = d.exists ? (d.data() || {}) : {}; if (cfgOk) render(); cfgOk = true; });
  assistirVisual(); aplicarVisual();
  db.doc('config/categorias').onSnapshot((d) => { aprend = d.exists ? (d.data().mapa || {}) : {}; });
  db.doc('config/plano').onSnapshot((d) => { plano = d.exists ? (d.data() || {}) : {}; render(); });
  const sub = (col, set) => col.onSnapshot((sn) => { set(sn.docs.map((d) => ({ ...d.data(), id: d.id }))); loaded = Math.max(loaded, 0); render(); });
  loaded = 3;
  setTimeout(() => { try { localStorage.setItem('gege-tentativas', '0'); } catch (e) {} const pend = updPendente(); if (pend) avisoAtualizacao('pronta', pend); buscarAtualizacao(false); }, 3000);
  sub(C.lanc, (v) => { lanc = v; }); sub(C.rec, (v) => { rec = v; }); sub(C.obj, (v) => { obj = v; });
  render();
  if (!nativo() && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>

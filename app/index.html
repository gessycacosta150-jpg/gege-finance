(function () {
  try {
    if (window.__gegeAtual) return;
    localStorage.setItem('gege-nativo', String(window.GEGE_NATIVO));
    var v = +localStorage.getItem('gege-app-v') || 0, h = localStorage.getItem('gege-app-html'), t = +localStorage.getItem('gege-tentativas') || 0;

  else if (a === 'cfg-save') salvarCfg();

  else if (a === 'vis-trocar') { const f = document.getElementById('vis-foto'); if (f) { f.value = ''; f.click(); } }
  else if (a === 'vis-rm') tirarFoto();
  else if (a === 'av-teste') testarAviso().catch(() => toast('⚠️ Não consegui agendar o aviso.'));
  else if (a === 'bk-exp') exportar();
  else if (a === 'bk-imp') { const f = document.getElementById('bk-file'); if (f) { f.value = ''; f.click(); } }
  else if (a === 'bk-ok') restaurar();
});
document.addEventListener('change', async (ev) => {
  const el = ev.target;
  if (el.id === 'bk-file') { if (el.files && el.files[0]) lerBackup(el.files[0]); return; }
  if (el.id === 'vis-foto') { if (el.files && el.files[0]) carregarFoto(el.files[0]); return; }
  if (el.id === 'f-file') { if (el.files && el.files[0]) lerArquivo(el.files[0]).catch(() => erro('Não foi possível abrir o arquivo.')); return; }
  if (el.dataset.chg === 'imp') { const I = $ed._c; I.origem = val('f-origem'); I.mes = val('f-impmes'); if (I.brutos) { montarImp(I); impForm(); } return; }
  if (el.dataset.act === 'sel') { el.checked ? st.sel.add(el.dataset.k) : st.sel.delete(el.dataset.k); render(); return; }
  if (el.dataset.act === 'plano-ck') { if (canWrite) marcarPlano(+el.dataset.k, el.checked); return; }
  if (el.dataset.act === 'sel-grp') { const its = visiveis(st.tab === 'recebimentos' ? 'entrada' : 'saida').filter((x) => x.grupo === el.dataset.k).map(key); its.forEach((x) => el.checked ? st.sel.add(x) : st.sel.delete(x)); render(); return; }
  if (el.dataset.act !== 'toggle') return;
  const x = achar(el.dataset.k); if (!x) return;
  el.disabled = true;
  try { if (x.id) await C.lanc.doc(x.id).update({ pago: el.checked }); else await C.lanc.doc(instId(x)).set(corpo({ ...x, pago: el.checked }));
    if (el.checked) { const n = doMes(x.mes).filter((q) => q.tipo !== 'entrada' && !q.pago && key(q) !== el.dataset.k).length; toast(x.tipo === 'entrada' ? '💰 Caiu na conta! Agora sim.' : n ? '✅ Menos uma! Faltam ' + n + (n === 1 ? ' conta.' : ' contas.') : '👑 Zerou as contas do mês!'); } }
  catch (e) { el.checked = !el.checked; el.disabled = false; if (e && e.code === 'invalid_argument') { canWrite = false; render(); } }
});
document.addEventListener('input', (ev) => { if (ev.target.id !== 'q') return; st.q = ev.target.value; const l = document.getElementById('lista'); if (l) l.innerHTML = listaHtml(st.tab === 'recebimentos' ? 'entrada' : 'saida'); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$ed.hidden) fechar(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== st.tab && okTab(h)) { st.tab = h; render(); } });

/* ---------- armazenamento local ---------- */
const CHAVE = 'contas-gessyca-v1';
let MEM = { lancamentos: {}, recorrentes: {}, objetivos: {}, config: {} };
try { const r = localStorage.getItem(CHAVE); if (r) MEM = Object.assign(MEM, JSON.parse(r)); } catch (e) {}
const OUV = {};
function gravar() { try { localStorage.setItem(CHAVE, JSON.stringify(MEM)); } catch (e) { toast('⚠️ Não consegui salvar no celular. Faça um backup agora.'); } }
function avisar(c) { const list = OUV[c] || []; setTimeout(() => list.forEach((f) => f()), 0); }
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const snapDoc = (c, id) => ({ id, exists: !!MEM[c][id], data: () => MEM[c][id] ? JSON.parse(JSON.stringify(MEM[c][id])) : undefined });
function refDoc(c, id) {
  return { id, path: c + '/' + id,
    get: async () => snapDoc(c, id),
    set: async (d) => { MEM[c][id] = JSON.parse(JSON.stringify(d)); gravar(); avisar(c); },
    update: async (d) => { if (!MEM[c][id]) throw { code: 'invalid_argument' }; MEM[c][id] = { ...MEM[c][id], ...JSON.parse(JSON.stringify(d)) }; gravar(); avisar(c); },
    delete: async () => { delete MEM[c][id]; gravar(); avisar(c); },
    onSnapshot: (f) => { const g = () => f(snapDoc(c, id)); (OUV[c] = OUV[c] || []).push(g); g(); return () => { OUV[c] = OUV[c].filter((x) => x !== g); }; } };
}
function refCol(c) {
  if (!MEM[c]) MEM[c] = {};
  return { path: c, doc: (id) => refDoc(c, id || novoId()),
    add: async (d) => { const r = refDoc(c, novoId()); await r.set(d); return r; },
    onSnapshot: (f) => { const g = () => f({ docs: Object.keys(MEM[c]).sort().map((id) => snapDoc(c, id)) }); (OUV[c] = OUV[c] || []).push(g); g(); return () => { OUV[c] = OUV[c].filter((x) => x !== g); }; } };
}
const LOCAL = { collection: refCol, doc: (p) => { const [c, id] = p.split('/'); if (!MEM[c]) MEM[c] = {}; return refDoc(c, id); } };
const vazio = () => !Object.keys(MEM.lancamentos).length && !Object.keys(MEM.recorrentes).length;
const nativo = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
async function exportar() {
  const txt0 = JSON.stringify({ app: 'contas-gessyca', versao: 1, salvoEm: new Date().toISOString(), dados: MEM }, null, 1);
  if (nativo()) {
    try { const { Filesystem, Share } = window.Capacitor.Plugins, nome = 'gege-finance-backup-' + hoje() + '.json';
      const r = await Filesystem.writeFile({ path: nome, data: txt0, directory: 'CACHE', encoding: 'utf8' });
      await Share.share({ title: 'Backup do Gege Finance', text: 'Backup do Gege Finance (' + dia(hoje()) + ')', files: [r.uri], dialogTitle: 'Guardar backup em…' });
      toast('⬇️ Escolha onde guardar: Drive, WhatsApp ou e-mail para você mesma.');
    } catch (e) { if (!/cancel/i.test(String(e && (e.message || e)))) toast('⚠️ Não consegui gerar o backup agora.'); }
    return;
  }
  const txt = JSON.stringify({ app: 'contas-gessyca', versao: 1, salvoEm: new Date().toISOString(), dados: MEM }, null, 1);
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = 'gege-finance-backup-' + hoje() + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('⬇️ Backup salvo em Downloads. Guarde num lugar seguro!');
}
async function lerBackup(file) {
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('⚠️ Esse arquivo não é um backup válido.'); return; }
  const d = j && j.dados; if (!d || typeof d.lancamentos !== 'object') { toast('⚠️ Esse arquivo não é um backup do Gege Finance.'); return; }
  const n = Object.keys(d.lancamentos || {}).length, r = Object.keys(d.recorrentes || {}).length;
  sheet(`<h2>Restaurar backup</h2><p style="margin:0">O arquivo tem <b>${n}</b> lançamentos e <b>${r}</b> contas que se repetem${j.salvoEm ? ', salvo em ' + esc(dia(j.salvoEm.slice(0, 10))) + '/' + j.salvoEm.slice(0, 4) : ''}.</p>
    ${vazio() ? '' : '<p class="neg" style="margin:0">Isso substitui tudo o que está no app agora.</p>'}
    <div class="acts"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn" data-act="bk-ok">Restaurar</button></div>`, { kind: 'bk', d });
}
function restaurar() {
  const d = $ed._c.d; MEM = { lancamentos: {}, recorrentes: {}, objetivos: {}, config: {}, ...JSON.parse(JSON.stringify(d)) }; gravar();
  ['lancamentos', 'recorrentes', 'objetivos', 'config'].forEach(avisar); fechar(); toast('🎉 Backup restaurado! Tudo de volta no lugar.'); ir('inicio');
}

(async () => {
  const h = location.hash.slice(1); if (okTab(h)) st.tab = h;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  db = LOCAL;
  C = { lanc: db.collection('lancamentos'), rec: db.collection('recorrentes'), obj: db.collection('objetivos') };
  db.doc('config/ajustes').onSnapshot((d) => { cfg = d.exists ? (d.data() || {}) : {}; if (cfgOk) render(); cfgOk = true; });
  assistirVisual(); aplicarVisual();
  db.doc('config/categorias').onSnapshot((d) => { aprend = d.exists ? (d.data().mapa || {}) : {}; });
  db.doc('config/plano').onSnapshot((d) => { plano = d.exists ? (d.data() || {}) : {}; render(); });
  const sub = (col, set) => col.onSnapshot((sn) => { set(sn.docs.map((d) => ({ ...d.data(), id: d.id }))); loaded = Math.max(loaded, 0); render(); });
  loaded = 3;
  setTimeout(() => { try { localStorage.setItem('gege-tentativas', '0'); } catch (e) {} buscarAtualizacao(false); }, 3000);
  sub(C.lanc, (v) => { lanc = v; }); sub(C.rec, (v) => { rec = v; }); sub(C.obj, (v) => { obj = v; });
  render();
  if (!nativo() && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
